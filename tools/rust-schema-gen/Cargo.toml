[package]
name = "schema-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = { version = "1.6", features = [
    "borsh-derive",
    "derive",
    "unstable__schema",
] }
borsh-schema-export = { path = "../../../borsh-schema-export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
